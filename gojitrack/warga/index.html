  <style>
    :root {
      --canvas: #0A0C0D; --surface: #121516; --raised: #1A1E20; --land: #15191B;
      --border: #2A2F32; --border-strong: #7A8286;
      --text: #FFFFFF; --text-2: #C5C5C5; --on-accent: #0A0C0D;
      --alert: #F8461E; --safe: #1F8B5C;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --sans: "Fustat", system-ui, sans-serif; --mono: "Fira Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--canvas); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
    button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
    .ic { display: block; flex: none; }
    .t-numeral-l { font: 500 24px/32px var(--mono); }
    .t-numeral-m { font: 500 16px/24px var(--mono); }
    .t-mono { font: 400 12px/16px var(--mono); }
    .t-mono-strong { font: 500 12px/16px var(--mono); }
    .t-title { font: 600 16px/24px var(--sans); }
    .t-heading { font: 600 20px/28px var(--sans); }
    .t-heading-l { font: 700 24px/32px var(--sans); }
    .t-body-l { font: 400 16px/24px var(--sans); }
    .t-body-strong { font: 600 14px/20px var(--sans); }
    .t-label { font: 500 12px/16px var(--sans); }
    .c2 { color: var(--text-2); } .ca { color: var(--alert); } .cs { color: var(--safe); }

    .nav { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 3; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-text { display: flex; flex-direction: column; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .updated-desk { display: none; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 4px; }
    .icon-btn:hover { background: var(--raised); }
    .icon-btn, .btn, .demo { transition: transform 160ms var(--ease-out); }
    .icon-btn:active, .btn:active, .demo:active { transform: scale(0.97); }
    #zoneGroup { transform-box: fill-box; transform-origin: center; }
    .breath { transform-box: fill-box; transform-origin: center; animation: breath 2.4s var(--ease-out) infinite; }
    @keyframes breath { from { transform: scale(1); opacity: .6; } to { transform: scale(2.4); opacity: 0; } }
    .step { transition: background-color 200ms var(--ease-out); }
    .spin .ic { animation: spin 600ms var(--ease-out); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .app { height: calc(100dvh - 56px); display: grid; grid-template-columns: 100%; grid-template-rows: auto 1fr auto; grid-template-areas: "top" "map" "sheet"; }
    .top { grid-area: top; }
    .mapwrap { grid-area: map; position: relative; overflow: hidden; min-height: 200px; }
    .mapwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .sheet { grid-area: sheet; background: var(--surface); border-top: 1px solid var(--border); border-radius: 8px 8px 0 0; padding: 16px 12px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 2; }

    .alert { background: var(--alert); color: var(--on-accent); padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 4px; }
    .alert.enter { animation: drop 240ms var(--ease-out); }
    .alert-title { display: flex; align-items: center; gap: 8px; }
    @keyframes drop { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .next { background: var(--safe); color: var(--on-accent); padding: 12px 4px 12px 12px; display: flex; align-items: center; gap: 12px; }
    .next > div { flex: 1; }
    .strip { background: var(--alert); color: var(--on-accent); padding: 8px 12px; display: flex; align-items: center; gap: 8px; }

    .status { display: flex; align-items: center; gap: 12px; }
    .box { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; flex: none; background: var(--raised); }
    .box.safe { background: var(--safe); color: var(--on-accent); }
    .group { display: flex; flex-direction: column; gap: 8px; }
    .kaiju { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--raised); border-radius: 4px; }
    .kaiju > div { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .ring { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--alert); flex: none; }
    .tag { display: inline-flex; padding: 4px 8px; border-radius: 4px; font: 500 12px/16px var(--mono); white-space: nowrap; }
    .tag.mon { box-shadow: inset 0 0 0 1px var(--border-strong); color: var(--text-2); }
    .tag.safe { background: var(--safe); color: var(--on-accent); }
    .line { display: flex; align-items: center; gap: 8px; }
    .line > :nth-child(2) { flex: 1; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .fact { display: flex; flex-direction: column; gap: 4px; }
    .fact .t-label { color: var(--text-2); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: 4px; font: 600 16px/24px var(--sans); width: 100%; }
    .btn.secondary { box-shadow: inset 0 0 0 1px var(--border-strong); }
    .btn.safe { background: var(--safe); color: var(--on-accent); }
    .demo { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 4px; color: var(--text-2); font: 500 12px/16px var(--mono); border: 1px dashed var(--border-strong); }
    .demo:hover { color: var(--text); }
    .steps { display: flex; flex-direction: column; }
    .step { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
    .step span:nth-child(2) { flex: 1; }
    .step.now { background: var(--raised); border-radius: 4px; border-top: 0; padding: 12px; margin-bottom: 1px; }
    .summary { display: flex; align-items: center; gap: 12px; }
    .summary > div { flex: 1; }
    .desk { display: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    @media (min-width: 960px) {
      .updated-desk { display: block; }
      .app { grid-template-columns: 480px 1fr; grid-template-rows: auto 1fr; grid-template-areas: "top map" "sheet map"; }
      .top, .sheet { background: var(--surface); }
      .top { padding: 12px 12px 0; border-right: 1px solid var(--border); }
      .top:empty { padding: 0; }
      .sheet { border-radius: 0; border-top: 0; border-right: 1px solid var(--border); padding: 16px 12px; justify-content: flex-start; overflow: auto; }
      .alert, .next { border-radius: 8px; padding: 16px; }
      .strip { border-radius: 4px; margin-top: 12px; }
      .desk { display: flex; }
      .mob { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .alert.enter, .spin .ic { animation: none; } .breath { display: none; } .icon-btn, .btn, .demo { transition: none; } }

const icon = (n, s = 24) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 256 256" aria-hidden="true">${ICONS[n][0] ? `<path d="${ICONS[n][0]}" fill="none" stroke="currentColor" stroke-width="21.33" stroke-linecap="round" stroke-linejoin="round"/>` : ''}${ICONS[n][1] ? `<path d="${ICONS[n][1]}" fill="currentColor"/>` : ''}</svg>`;

/* waktu WITA, dibulatkan ke siklus 30 menit */
const wita = d => new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Makassar' }).format(d).replace(':', '.');
function cycle() {
  const now = new Date(); const last = new Date(Math.floor(now / 1800000) * 1800000); const next = new Date(+last + 1800000);
  return { last: wita(last), next: wita(next) };
}
let state = 'aman', etaMin = 98, alertAt = null;
const updatedText = () => { const c = cycle(); return state === 'aman' ? `Diperbarui ${c.last} WITA · berikutnya ${c.next}` : `Peringatan ${alertAt} WITA · rutin tiap 30 menit`; };
const etaText = () => `${Math.floor(etaMin / 60)} j ${String(etaMin % 60).padStart(2, '0')} m`;

/* overlay peta */
const mono = 7.2;
function label(x, y, name, meta, sel) {
  const w = 16 + name.length * mono + (meta ? 8 + meta.length * mono : 0);
  return `<g><rect x="${x}" y="${y}" width="${w}" height="24" rx="4" fill="#0A0C0D" stroke="${sel ? '#F8461E' : '#7A8286'}"/>
    <text x="${x + 8}" y="${y + 16}" font-family="Fira Mono, monospace" font-size="12" font-weight="500" fill="#FFFFFF">${name}${meta ? `<tspan dx="8" font-weight="400" fill="#C5C5C5">${meta}</tspan>` : ''}</text></g>`;
}
const chip = (x, y, t, c, s) => `<g><rect x="${x}" y="${y}" width="${16 + t.length * mono}" height="24" rx="4" fill="#0A0C0D" stroke="${s}"/><text x="${x + 8}" y="${y + 16}" font-family="Fira Mono, monospace" font-size="12" font-weight="500" fill="${c}">${t}</text></g>`;
const user = `<g id="userG"><circle class="breath" cx="600" cy="420" r="11" fill="none" stroke="#FFFFFF" stroke-width="2"/><circle cx="600" cy="420" r="11" fill="#0A0C0D" stroke="#FFFFFF" stroke-width="2"/><circle cx="600" cy="420" r="6" fill="#FFFFFF"/>` + chip(616, 426, 'ANDA', '#FFFFFF', '#7A8286') + '</g>';
const narrow = () => $('mapwrap').clientWidth < 600;
const evac = (lbl) => `<circle cx="780" cy="360" r="20" fill="#1F8B5C" stroke="#0A0C0D" stroke-width="2"/><svg x="768" y="348" width="24" height="24" viewBox="0 0 256 256" color="#0A0C0D">${icon('shield-check').replace(/<svg[^>]*>|<\/svg>/g, '')}</svg>` + (lbl ? (narrow() ? label(754, 312, 'TE-07', '') : label(710, 312, 'TE-07', 'Panakkukang')) : '');
const zone = `<g id="zoneGroup"><circle cx="560" cy="440" r="99" fill="rgba(248,70,30,.12)" stroke="#F8461E" stroke-width="2" stroke-dasharray="8 8"/>` + chip(508, 548, 'ZONA BAHAYA', '#F8461E', '#F8461E') + '</g>';
const kaiju = `<path d="M452 440H540" stroke="#F8461E" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/><path d="M532 432l8 8-8 8" fill="none" stroke="#F8461E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` + label(486, 452, 'GODZILLA', '62 km', true);
const route = `<path class="route-line" d="M600 420V400H720V360H780" fill="none" stroke="#0A0C0D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path class="route-line" d="M600 420V400H720V360H780" fill="none" stroke="#1F8B5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path id="walked" fill="none" stroke="#7A8286" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
const VIEWS = {
  aman: { f: [640, 420], ov: () => evac(true) + user },
  peringatan: { f: [640, 420], ov: () => zone + kaiju + route + evac(true) + user },
  arah: { f: [690, 400], ov: () => zone + route + evac(true) + user }
};
const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)', EASE_IN_OUT = 'cubic-bezier(0.77, 0, 0.175, 1)';
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
/* cubic-bezier(0.77, 0, 0.175, 1) for the viewBox tween */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t, dX = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { let t = x; for (let i = 0; i < 8; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - x) / d; t = Math.min(1, Math.max(0, t)); } return Y(t); };
}
const easeInOut = bezier(0.77, 0, 0.175, 1);
let vbRaf = 0;
function fitMap(animate) {
  const el = $('mapwrap'), svg = $('svg'); const w = el.clientWidth, h = el.clientHeight; const fy = VIEWS[state].f[1]; const fx = w < 600 ? 660 : VIEWS[state].f[0];
  const to = [fx - w / 2, fy - h / 2, w, h]; cancelAnimationFrame(vbRaf);
  const vb = svg.viewBox.baseVal; const from = vb && vb.width ? [vb.x, vb.y, vb.width, vb.height] : null;
  if (!animate || reduce.matches || !from || (from[0] === to[0] && from[1] === to[1])) { svg.setAttribute('viewBox', to.join(' ')); return; }
  const start = performance.now(), dur = 400;
  const step = now => { const k = easeInOut(Math.min(1, (now - start) / dur)); svg.setAttribute('viewBox', from.map((v, i) => v + (to[i] - v) * k).join(' ')); if (k < 1) vbRaf = requestAnimationFrame(step); };
  vbRaf = requestAnimationFrame(step);
}
function enterAlertMap() {
  const z = $('zoneGroup');
  if (reduce.matches) { if (z) z.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: EASE_OUT }); return; }
  if (z) z.animate([{ opacity: 0, transform: 'scale(0.9)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 300, easing: EASE_OUT });
  document.querySelectorAll('.route-line').forEach(r => { const len = r.getTotalLength(); r.style.strokeDasharray = len; r.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 600, delay: 200, easing: EASE_IN_OUT, fill: 'backwards' }); });
}
function swapIn(el, dy) { if (!el || !el.firstElementChild) return; el.animate(reduce.matches ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: 'none' }], { duration: 200, easing: EASE_OUT }); }

/* tampilan per kondisi */
function render(o = {}) {
  const top = $('top'), sheet = $('sheet');
  document.querySelectorAll('[data-updated]').forEach(e => e.textContent = updatedText());
  $('ov').innerHTML = VIEWS[state].ov();
  if (state === 'aman') {
    top.innerHTML = '';
    sheet.innerHTML = `
      <div class="status"><span class="box cs">${icon('shield-check')}</span>
        <div><h1 class="t-heading">Wilayah Anda aman</h1><p class="c2">Tidak ada kaiju dalam radius 500 km.</p></div></div>
      <div class="group"><p class="t-label c2">Kaiju terdekat</p>
        <div class="kaiju"><span class="ring" aria-hidden="true"></span><div><span class="t-numeral-m">GODZILLA</span><span class="t-label c2">1.240 km · Laut Banda</span></div><span class="tag mon">DIPANTAU</span></div></div>
      <div class="group desk"><p class="t-label c2">Kenali titik evakuasi Anda</p>
        <div class="line"><span class="cs">${icon('shield-check')}</span><div><p class="t-body-strong">TE-07 Panakkukang</p><p class="t-mono c2">4,8 km · 60 menit jalan kaki</p></div></div></div>
      <div class="line mob"><span class="c2">${icon('clock', 20)}</span><span>Diperbarui ${cycle().last} WITA</span><span class="t-mono c2">Berikutnya ${cycle().next}</span></div>
      <button class="btn secondary" data-act="refresh">${icon('arrows-clockwise')}Muat ulang</button>
      <button class="demo" data-act="simulate">${icon('siren', 16)}Demo · simulasikan peringatan</button>`;
  }
  if (state === 'peringatan') {
    top.innerHTML = `
      <div class="alert${o.enter ? ' enter' : ''}"><div class="alert-title">${icon('siren')}<h1 class="t-heading-l">EVAKUASI SEKARANG</h1></div>
        <p class="t-body-l">GODZILLA diperkirakan tiba di pesisir Makassar dalam <span data-eta-long>${Math.floor(etaMin / 60)} jam ${etaMin % 60} menit</span>.</p></div>`;
    sheet.innerHTML = `
      <div class="group"><p class="t-label c2">Titik evakuasi terdekat</p>
        <div class="status"><span class="box safe">${icon('shield-check')}</span><div><p class="t-title">TE-07 Panakkukang</p><p class="t-label c2">Di luar zona bahaya · masih menampung</p></div></div></div>
      <div class="facts">
        <div class="fact"><span class="t-label">Jarak</span><span class="t-numeral-m">4,8 km</span></div>
        <div class="fact"><span class="t-label">Jalan kaki</span><span class="t-numeral-m">60 mnt</span></div>
        <div class="fact"><span class="t-label">Kaiju tiba</span><span class="t-numeral-m ca" data-eta>${etaText()}</span></div></div>
      <button class="btn safe" data-act="arah">${icon('navigation-arrow')}Lihat arah evakuasi</button>
      <p class="t-mono c2" data-updated></p>
      <button class="demo" data-act="reset">Demo · kembali ke kondisi aman</button>`;
  }
  if (state === 'arah') {
    top.innerHTML = `
      <div class="next"><span id="nextIcon">${icon('arrow-bend-up-right', 32)}</span><div><p class="t-numeral-l" id="nextDist">400 m</p><p class="t-body-l" id="nextText">Belok kanan ke Jl. Sungai Saddang</p></div>
        <button class="icon-btn" data-act="back" aria-label="Tutup navigasi">${icon('x')}</button></div>
      <div class="strip">${icon('siren', 16)}<p class="t-label">GODZILLA tiba dalam <span data-eta>${etaText()}</span> · tetap di rute</p></div>`;
    sheet.innerHTML = `
      <div class="summary"><div><p class="t-numeral-l"><span id="sumMin">60</span> mnt</p><p class="t-label c2"><span id="sumKm">4,8</span> km lagi · simulasi jalan kaki ×60</p></div><span class="tag safe">RUTE AMAN</span></div>
      <div class="steps">
        <div class="step now" data-step="0">${icon('arrow-up')}<span class="t-body-strong">Jl. Penghibur</span><span class="t-mono" data-d="0,4 km">sekarang</span></div>
        <div class="step" data-step="1">${icon('arrow-bend-up-right')}<span class="t-body-strong">Jl. Sungai Saddang</span><span class="t-mono c2" data-d="2,4 km">2,4 km</span></div>
        <div class="step" data-step="2">${icon('arrow-bend-up-left')}<span class="t-body-strong">Jl. Veteran</span><span class="t-mono c2" data-d="0,8 km">0,8 km</span></div>
        <div class="step" data-step="3">${icon('arrow-bend-up-right')}<span class="t-body-strong">Jl. Pengayoman</span><span class="t-mono c2" data-d="1,2 km">1,2 km</span></div>
        <div class="step" data-step="4"><span class="cs">${icon('shield-check')}</span><span class="t-body-strong">TE-07 Panakkukang</span><span class="t-mono c2" data-d="Tujuan">Tujuan</span></div></div>
      <button class="btn secondary" data-act="back">${icon('x')}Akhiri navigasi</button>`;
  }
  document.querySelectorAll('[data-updated]').forEach(e => e.textContent = updatedText());
  fitMap(o.move);
  if (o.swap) { swapIn(sheet, 8); if (state === 'arah') swapIn(top, -8); }
  if (o.enter) enterAlertMap();
}

/* simulated walk along the route, 1 map unit = 20 m, 80 m per minute, ×60 */
const ROUTE = [[600, 420], [600, 400], [720, 400], [720, 360], [780, 360]];
const SEGS = ROUTE.slice(1).map((p, i) => Math.hypot(p[0] - ROUTE[i][0], p[1] - ROUTE[i][1]));
const TOTAL = SEGS.reduce((a, b) => a + b, 0);
const TURNS = [['arrow-bend-up-right', 'Belok kanan ke Jl. Sungai Saddang'], ['arrow-bend-up-left', 'Belok kiri ke Jl. Veteran'], ['arrow-bend-up-right', 'Belok kanan ke Jl. Pengayoman'], ['shield-check', 'Tiba di TE-07 Panakkukang']];
const walk = { d: 0, raf: 0, seg: -1 };
function posAt(d) {
  let rest = d, i = 0;
  while (i < SEGS.length - 1 && rest > SEGS[i]) { rest -= SEGS[i]; i++; }
  rest = Math.min(rest, SEGS[i]);
  const [a, b] = [ROUTE[i], ROUTE[i + 1]], k = rest / SEGS[i];
  return { x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, seg: i, toEnd: SEGS[i] - rest, pts: ROUTE.slice(0, i + 1) };
}
const km = m => (m / 1000).toFixed(1).replace('.', ',');
function updateWalk() {
  const g = $('userG'); if (!g || state !== 'arah') return;
  const p = posAt(walk.d), done = walk.d >= TOTAL;
  g.setAttribute('transform', `translate(${(p.x - 600).toFixed(1)} ${(p.y - 420).toFixed(1)})`);
  $('walked').setAttribute('d', 'M' + p.pts.concat([[p.x, p.y]]).map(q => q.join(' ')).join('L'));
  const seg = done ? 4 : p.seg;
  if (seg !== walk.seg) {
    walk.seg = seg;
    $('nextIcon').innerHTML = icon(done ? 'shield-check' : TURNS[p.seg][0], 32);
    $('nextText').textContent = done ? 'Anda sudah sampai di TE-07 Panakkukang' : TURNS[p.seg][1];
    document.querySelectorAll('.step').forEach(st => { const n = +st.dataset.step, on = n === seg, d = st.lastElementChild;
      st.classList.toggle('now', on); d.textContent = on && !done ? 'sekarang' : d.dataset.d; d.classList.toggle('c2', !on); });
  }
  $('nextDist').textContent = done ? 'Tiba' : `${Math.max(10, Math.round(p.toEnd * 20 / 10) * 10)} m`;
  const left = (TOTAL - walk.d) * 20;
  $('sumMin').textContent = Math.ceil(left / 80); $('sumKm').textContent = km(left);
}
function startWalk() {
  cancelAnimationFrame(walk.raf); walk.d = 0; walk.seg = -1; updateWalk();
  if (reduce.matches) return;
  let last = performance.now();
  const step = now => { walk.d = Math.min(TOTAL, walk.d + 4 * (now - last) / 1000); last = now; updateWalk(); if (walk.d < TOTAL && state === 'arah') walk.raf = requestAnimationFrame(step); };
  walk.raf = requestAnimationFrame(step);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'simulate') { state = 'peringatan'; alertAt = wita(new Date()); etaMin = 98; render({ enter: true, swap: true, move: true }); $('announce').textContent = 'Peringatan evakuasi. Segera menuju titik evakuasi TE-07 Panakkukang.'; }
  if (a === 'arah') { state = 'arah'; render({ swap: true, move: true }); startWalk(); }
  if (a === 'back') { cancelAnimationFrame(walk.raf); state = 'peringatan'; render({ swap: true, move: true }); }
  if (a === 'reset') { state = 'aman'; render({ swap: true, move: true }); }
  if (a === 'refresh') refresh();
});
function refresh() { const r = $('refresh'); r.classList.remove('spin'); void r.offsetWidth; r.classList.add('spin'); render(); walk.seg = -1; updateWalk(); }
$('refresh').onclick = refresh;
setInterval(() => { if (etaMin > 0) etaMin--; document.querySelectorAll('[data-eta]').forEach(e => e.textContent = etaText()); document.querySelectorAll('[data-eta-long]').forEach(e => e.textContent = `${Math.floor(etaMin / 60)} jam ${etaMin % 60} menit`); }, 60000);
window.addEventListener('resize', () => { $('ov').innerHTML = VIEWS[state].ov(); fitMap(); walk.seg = -1; updateWalk(); });
render();
</script>
